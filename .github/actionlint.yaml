# MANAGED BY shunsock/github_central — このファイルは gh-infra で配信される。
# 変更は github_central 側の owners/shunsock/files/all_repository/ で行うこと。
#
# actionlint は runs-on のラベルを GitHub ホストランナーの既知リストと照合し、
# 未知のラベルをエラーにする。配信 workflow は Ubicloud のマネージドランナーを
# 使うため、そのラベルをここで宣言して runner-label 検査を通す。
# サイズ (standard-2/4/...) は配信先が独自 workflow で自由に選べるよう
# glob で全サイズを許可する。
self-hosted-runner:
  labels:
    - ubicloud-*
# CONSTRAINT: concurrency の queue キーの指摘は除外しなくてはならない。
# REASON: GitHub は queue を受け付けるが actionlint v1.7.12 が未対応のため。
# TODO: actionlint が queue に対応したらこの除外を削除する。
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
